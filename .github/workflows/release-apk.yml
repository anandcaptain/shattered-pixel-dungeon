name: Build and Commit Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate random signing credentials
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9')
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias releasekey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=SPD Fork, OU=Dev, O=Dev, L=Unknown, S=Unknown, C=US"

      - name: Build release APK
        run: |
          ./gradlew android:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password="$STORE_PASS"

      - name: Copy APK and write credentials file
        run: |
          mkdir -p release-output
          cp android/build/outputs/apk/release/*.apk release-output/
          cp release.keystore release-output/release.keystore
          echo "store_password=$STORE_PASS" > release-output/keystore-credentials.txt
          echo "key_alias=releasekey" >> release-output/keystore-credentials.txt
          echo "key_password=$STORE_PASS" >> release-output/keystore-credentials.txt

      - name: Commit and push APK + keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p release-artifacts
          cp release-output/* release-artifacts/
          git add release-artifacts/
          git commit -m "Add signed release APK and keystore [skip ci]"
          git push
